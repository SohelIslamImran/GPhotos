name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        id: version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Use a version tag such as v1.2.0."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::Tag a commit on main."
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  test-macos:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      platforms: '["macOS"]'

  test-ios:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      platforms: '["iOS"]'

  macos:
    name: Sign and notarize macOS
    needs: [version, test-macos]
    runs-on: xcode-27
    timeout-minutes: 150
    environment: macos-release
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      GPHOTOS_BUNDLE_ID: ${{ vars.GPHOTOS_BUNDLE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
      - name: Archive with Developer ID
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          MAC_PROFILE_BASE64: ${{ secrets.MAC_PROFILE_BASE64 }}
        run: scripts/ci-release.sh macos
      - name: Notarize, staple and package
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: scripts/ci-release.sh notarize
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-macos
          path: dist/GPhotos-*
          if-no-files-found: error
          retention-days: 7

  ios-ipa:
    name: Package unsigned iOS IPA
    needs: version
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
      - name: Build unsigned IPA
        run: scripts/ci-release.sh ios-ipa
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-ios
          path: dist/GPhotos-*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [macos, test-ios, ios-ipa]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-macos
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-ios
          path: dist
      - name: Publish versioned DMG and IPA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          (cd dist && sha256sum --check -- *.sha256)
          cat > release-notes.md <<'NOTES'
          ## Downloads

          - **macOS DMG** — Developer ID signed and Apple-notarized. Open the disk image and drag GPhotos to Applications. Requires Apple silicon and macOS 27 or later.
          - **Unsigned iOS IPA** — For self-signing on iPhone and iPad running iOS/iPadOS 27 or later. Supply your own signing identity and provision the app and its extensions. Features that share data across targets require a shared App Group.

          Each download has a SHA-256 checksum.
          NOTES
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "GPhotos $GITHUB_REF_NAME" --notes-file release-notes.md dist/*

  testflight:
    name: Upload iOS to App Store Connect
    if: vars.ENABLE_TESTFLIGHT == 'true'
    needs: [version, test-ios]
    runs-on: xcode-27
    timeout-minutes: 40
    environment: ios-release
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      GPHOTOS_BUNDLE_ID: ${{ vars.GPHOTOS_BUNDLE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
      - name: Sign and upload to App Store Connect
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_SHARE_PROFILE_BASE64: ${{ secrets.IOS_SHARE_PROFILE_BASE64 }}
          IOS_UPLOAD_PROFILE_BASE64: ${{ secrets.IOS_UPLOAD_PROFILE_BASE64 }}
          IOS_WIDGETS_PROFILE_BASE64: ${{ secrets.IOS_WIDGETS_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: scripts/ci-release.sh testflight
